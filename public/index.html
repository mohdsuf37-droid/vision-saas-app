<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Vision Label Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 { color: #333; }
    form {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="file"] { margin: 12px 0; }
    input[type="submit"] {
      background: #4285F4;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    input[type="submit"]:hover { background: #3367D6; }
  </style>
</head>
<body>
  <h1>🔍 Google Cloud Vision Label Detector</h1>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <p>Select an image to detect labels:</p>
    <input type="file" name="pic" accept="image/*" required>
    <br>
    <input type="submit" value="Upload & Analyze">
  </form>
</body>
</html>
